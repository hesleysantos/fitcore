# Publica o site (pasta www/) no GitHub Pages a cada envio para a branch principal.
# Antes de publicar, roda os testes automáticos e a verificação das animações.
# Teste e publicação em trabalhos separados, como na documentação do GitHub Pages: logo depois do envio do pacote, o
# GitHub às vezes ainda não o encontra ("No artifacts named github-pages"). Se a publicação falhar, tenta de novo
# depois de 1 minuto.
# As ações estão fixadas pelo código exato da versão (não por etiqueta), para que ninguém possa trocá-las.
# Ative uma vez em: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # não interrompe uma publicação já em andamento

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Testes
        run: npm test
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: www

  publicar:
    needs: testar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Esperar 1 minuto antes de tentar de novo
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
